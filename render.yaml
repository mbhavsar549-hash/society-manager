# Render Blueprint: creates the API web service + a PostgreSQL database in one go.
databases:
  - name: society-db
    plan: free
    databaseName: society
    user: society

services:
  - type: web
    name: society-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: society-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SEED
        value: "0"
      - key: ADMIN_EMAIL
        sync: false          # you type this in the Render dashboard
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false          # your Netlify URL, filled in after step 2
